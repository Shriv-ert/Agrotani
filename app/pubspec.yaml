name: app
description: "Agrotani — AI-powered plant disease diagnosis for Indonesian farmers"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1

  # State Management
  flutter_riverpod: ^3.3.1

  # Navigation
  go_router: ^15.1.2

  # Networking
  dio: ^5.9.2

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4

  # Camera & Image
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # UX Polish
  shimmer: ^3.0.0

  # Utilities (intl removed — using manual date formatting)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/icons/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
